{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <h1>Вход</h1>
    <p class="subtitle">Войдите в аккаунт, чтобы продолжить</p>
    <form method="post" action="{{ url_for('auth.login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required value="{{ form.email.data or '' }}" autocomplete="email">
        {% for e in form.email.errors %}<p class="error">{{ e }}</p>{% endfor %}
      </div>
      <div class="form-group">
        <label for="password">Пароль</label>
        <input id="password" name="password" type="password" required autocomplete="current-password">
        {% for e in form.password.errors %}<p class="error">{{ e }}</p>{% endfor %}
      </div>
      <button type="submit" class="btn btn-primary">Войти</button>
    </form>
    <p class="link-bottom">Нет аккаунта? <a href="{{ url_for('auth.register') }}">Зарегистрироваться</a></p>
  </div>
</div>
{% endblock %}
